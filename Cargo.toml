[package]
name = "kobold-data-shim"
version = "0.1.0"
edition = "2021"
rust-version = "1.74"
description = "A verifiable COBOL record-decoding shim for data-migration pipelines: ingest a copybook + a raw record dump and decode it byte-exactly via the oracle-proven gnucobol-rs courts (PIC, layout, COPY, decimal MOVE)."
license = "Apache-2.0"
authors = ["infinityabundance"]
repository = "https://github.com/infinityabundance/kobold-data-shim"
homepage = "https://github.com/infinityabundance/kobold-data-shim"
readme = "README.md"
keywords = ["cobol", "copybook", "migration", "mainframe", "decode"]
categories = ["encoding", "command-line-utilities", "parsing"]

[dependencies]
# The byte-exact, oracle-proven kernel. NOTE: gnucobol-rs is LGPL-3.0-or-later; see NOTICE for the
# linking obligations this places on distributed binaries. This crate's own source is Apache-2.0.
gnucobol-rs = "0.2.4"

[lints.rust]
unsafe_code = "forbid"

[[bin]]
name = "kobold-record-dump"
path = "src/main.rs"
